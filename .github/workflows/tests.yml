name: tests

# The green/red gate for dev-cli: ruff + the full pytest suite (which includes the vendored-libs
# pinned-SHA drift guard, tests/test_vendored_libs_sync.py) on every PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match the package floor (requires-python >=3.9, the agenttools-config floor).
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: pip install -e '.[test]'
      - name: Unit suite (incl. vendored-libs drift guard)
        run: python -m pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned — an unpinned `pip install ruff` makes CI non-deterministic: a new release
        # can enable new default rules and flip a previously-green PR red with no code change
        # (discovered 2026-08-28 on an unrelated docs-only PR, whose new default rule set
        # flagged 72 pre-existing violations that were never actually fixed; see AGENTS.md
        # "Tests" for the incident and rationale). The ENFORCED source of truth is
        # `[tool.ruff] required-version` in pyproject.toml — ruff hard-fails on a mismatch;
        # this line and the README/AGENTS.md copies are for a human reading CI/docs, kept in
        # sync by tests/test_ruff_pin_sync.py. Bumping the version means updating
        # pyproject.toml + fixing new-rule fallout in the same change, not a side effect of
        # GitHub Actions silently fetching "latest" on every run.
        run: pip install ruff==0.15.18
      - name: ruff check
        run: ruff check .

  secret-scan:
    name: gitleaks (block on secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history — gitleaks scans commits, not just the tree)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # The gitleaks OSS binary, not gitleaks/gitleaks-action: the action wants a paid
      # GITLEAKS_LICENSE for an organization and looks the owner up through the GitHub API, so
      # on Forgejo it stops with "missing gitleaks license". Same engine and rules, no license.
      # Installed into a job-local dir on PATH (the runner user is not root).
      - name: Install gitleaks (OSS binary — no license)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP:-$(mktemp -d)}/gitleaks-bin"
          mkdir -p "$bin"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/gitleaks" version
      - name: gitleaks (scan the commits this event brings in)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Same scope as gitleaks-action: a PR scans its own commits, a push the pushed
          # commits (a new branch: its commits not on the default branch), anything else
          # (schedule / manual) the whole history.
          is_commit() { [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          range=""
          case "$EVENT_NAME" in
            pull_request|pull_request_target)
              is_commit "$PR_BASE_SHA" && is_commit "$PR_HEAD_SHA" && range="$PR_BASE_SHA..$PR_HEAD_SHA" ;;
            push)
              if [ "${PUSH_BEFORE//0/}" != "" ] && is_commit "$PUSH_BEFORE"; then
                range="$PUSH_BEFORE..$GITHUB_SHA"
              elif [ -n "$DEFAULT_BRANCH" ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ] \
                   && is_commit "origin/$DEFAULT_BRANCH"; then
                range="origin/$DEFAULT_BRANCH..$GITHUB_SHA"
              fi ;;
          esac
          if [ -n "$range" ]; then
            echo "gitleaks: scanning commits $range"
            gitleaks git --log-opts="$range" --redact --no-banner --exit-code 1 .
          else
            echo "gitleaks: scanning the full history"
            gitleaks git --redact --no-banner --exit-code 1 .
          fi
