name: vendored-libs-drift

# UPSTREAM-drift guard for the vendored agent-tools libraries (strategy B, the research-cli pattern).
#
# The pinned-SHA test (tests/test_vendored_libs_sync.py) runs on every PR and catches a LOCAL
# edit to a vendored copy — but it can't see the agent-tools canonical, so it can't catch the
# canonical CHANGING upstream while our pinned copy stays put. This scheduled job closes that
# gap: it checks out the agent-tools catalog and runs the re-sync script in --check mode, which
# fails when a vendored file no longer matches the current canonical. On drift it opens / updates
# a tracking issue instead of silently going stale.
#
# Cross-repo read: if agent-tools is private, set an AGENT_TOOLS_TOKEN secret and pass it as
# `token:` on that checkout step.
on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev-cli
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout agent-tools (the canonical lib source)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/agent-tools
          path: .agent-tools-src
          token: ${{ secrets.AGENT_TOOLS_TOKEN || github.token }}   # AGENT_TOOLS_TOKEN only while agent-tools is private

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Check the vendored libs against the current canonical
        id: drift
        run: |
          set +e
          python scripts/resync_vendored_libs.py --check "$GITHUB_WORKSPACE/.agent-tools-src"
          rc=$?
          set -e
          # rc 0 = in sync · rc 1 = real DRIFT (re-sync) · rc >=2 = infra error (path moved /
          # usage / crash) — the latter is NOT drift and "re-sync the body" would be wrong advice.
          if [ "$rc" -eq 0 ]; then
            echo "outcome=ok" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "outcome=drift" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=error" >> "$GITHUB_OUTPUT"
          fi

      - name: Open / update a tracking issue (real drift vs infra error get different advice)
        if: steps.drift.outputs.outcome != 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.drift.outputs.outcome }}" = "drift" ]; then
            title="vendored agent-tools libs have drifted from the canonical"
            body=$'The scheduled drift check found a vendored lib under `vendor/` is no longer in sync with the agent-tools canonical.\n\nRe-sync it:\n```\npython scripts/resync_vendored_libs.py /path/to/agent-tools\n```\nthen commit.'
          else
            title="vendored-libs drift CHECK failed (infra error, not drift)"
            body=$'The scheduled drift check exited with an infrastructure error (>=2), NOT a body mismatch — likely a canonical path moved in agent-tools (VENDORED list), a bad checkout, or a script crash. Re-syncing the body is NOT the fix; investigate the check itself. See `.github/workflows/vendored-libs-drift.yml`.'
          fi
          if [ "${GITHUB_SERVER_URL:-https://github.com}" != "https://github.com" ]; then
            # Forgejo / Gitea: no gh CLI there — the same find-or-create flow through the REST
            # API v1 (stdlib python3), with the job token.
            TITLE="$title" BODY="$body" python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          api = (os.environ.get("GITHUB_API_URL") or os.environ["GITHUB_SERVER_URL"].rstrip("/") + "/api/v1").rstrip("/")
          base = f"{api}/repos/{os.environ['GITHUB_REPOSITORY']}"
          title, body = os.environ["TITLE"], os.environ["BODY"]
          def call(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, method=method, headers={
                  "Accept": "application/json", "Content-Type": "application/json",
                  "Authorization": f"token {os.environ.get('GH_TOKEN', '')}"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read()
              return json.loads(raw) if raw else None
          found = call("GET", f"/issues?state=open&type=issues&limit=50&q={urllib.parse.quote(title)}") or []
          existing = next((i["number"] for i in found if i.get("title") == title), None)
          if existing:
              call("POST", f"/issues/{existing}/comments", {"body": body})
          else:
              labels = []
              try:
                  have = call("GET", "/labels?limit=50") or []
                  drift = next((l["id"] for l in have if l.get("name") == "drift"), None)
                  if drift is None:
                      drift = call("POST", "/labels", {"name": "drift", "color": "#fbca04",
                                                       "description": "vendored-copy drift from canonical"})["id"]
                  labels = [drift]
              except Exception as exc:  # a missing label must not stop the issue
                  print(f"note: could not ensure the drift label: {exc}")
              call("POST", "/issues", {"title": title, "body": body, "labels": labels})
          PY
            exit $?  # python's outcome: a failed find-or-create must fail the job
          fi
          # Match the EXACT title (the drift vs infra titles share words — a substring search
          # could comment on the wrong one). `--jq` filters on an exact `.title == $title`;
          # `// empty` keeps an empty result "" so the create branch stays reachable.
          existing=$(gh issue list --search "$title in:title" --state open --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty" || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create drift --color FBCA04 --description "vendored-copy drift from canonical" 2>/dev/null || true
            gh issue create --title "$title" --body "$body" --label drift
          fi
