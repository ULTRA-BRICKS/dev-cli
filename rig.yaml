# rig.yaml — REPO-LEVEL config only.
# The machine-wide installs (skills, agent-hooks, git-hooks dispatcher, MCP, harness
# auto-mode) live in the GLOBAL layer ~/.config/rig/config.yaml and are NOT repeated here.
# This file holds only what is specific to THIS repo. The cascade is by LOCATION: global is
# global, this committed file is the repo and overrides it.
# Apply: rig apply.  Drift: rig status.
#
# Scope note: dev-cli had NO rig.yaml at all until 2026-09-07 (never `rig init`'d — see git
# log, empty history for this path). This file is deliberately narrow, mirroring the minimal
# repo-level shape used by task-cli/draw-cli/research-cli's rig.yaml: it enrolls ONLY
# agent_hooks.worktree_only (Alex: agents were editing/branching directly in ecosystem repos'
# primary checkouts). dev-cli already has its own CI (.github/workflows/tests.yml,
# vendored-libs-drift.yml) and is NOT brought under rig's github/ci/project_tools/harness
# management here — a full `rig init --apply` was tried and rejected because it would push a
# live GitHub branch-protection ruleset (require_pull_request, admin_bypass, etc.) and other
# GitHub API changes as a side effect of unblocking this one guard. Widening this repo's rig
# scope beyond this key is a separate decision, not a side effect of enrolling the guard.

version: 1

# Worktree-only guard: primary checkout stays on the default branch for merge/pull/read-only
# only; all authoring happens in a separate `git worktree add` tree. Adds ONLY worktree_only
# on top of the global agent_hooks block (~/.config/rig/config.yaml, enabled/all) — does not
# change what hooks install, just gates worktree-only-writes (pre-write) + pin-primary-worktree
# (pre-bash). See rig-cli AGENTS.md "Harness workflow guards" and the
# RIG_HATCH_REQUEST_WORKTREE_ONLY_WRITES / RIG_HATCH_REQUEST_PIN_PRIMARY_WORKTREE hatches for a
# deliberate one-off bypass.
agent_hooks:
  worktree_only: true

task:
  backend: forgejo
  forgejo:
    url: https://git.hyperide.ai
    repo: ultrabricks/dev-cli
    attachment_mode: native
